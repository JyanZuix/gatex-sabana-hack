# Parámetros del módulo de cálculo y simulación.
# Fuente: docs/calculos_simulacion.md, sección 8. No cambiar sin actualizar ese documento.

recencia:
  vida_media_dias: 365            # H: un servicio de hace 12 meses pesa 0.5

prior:
  m: 10                           # fuerza del prior: equivale a 10 servicios promedio del mercado
  min_servicios_segmento: 20      # servicios mínimos para usar un segmento (ruta → corredor → nacional)
  por_defecto:                    # valores si no hay datos de mercado
    P0: 0.85
    R0: 0.10
    sigma0: 0.20

desempeno:
  peso_puntualidad: 0.75
  peso_magnitud_retraso: 0.25

confianza:
  # Q = (2/3)·S_desv + (1/3)·S_cump: la proporción original 0.40 / 0.20 sin el término de incidentes
  # (docs/decisiones.md, 2026-10-24). Se aceptan fracciones escritas como texto ("2/3").
  peso_consistencia: 2/3
  peso_cumplimiento_cliente: 1/3
  sigma_max: 0.5                  # ±50 % de variación = consistencia nula
  k_evidencia: 10                 # con 10 servicios efectivos, E = 0.5
  alfa_cliente: 2                 # un servicio con este cliente vale por 3
  piso_evidencia: 0.4             # confianza mínima de un proveedor nuevo
  niveles:
    alta: 75                      # C ≥ 75
    media: 55                     # 55 ≤ C < 75; por debajo, Baja

simulacion:
  n: 2000
  semilla: 42
  min_servicios_ruta: 5           # si W_ruta < 5 se usa todo el historial del proveedor
  percentil_tipico: 50
  percentil_mal_caso: 90
  percentiles_abanico: [5, 10, 25, 50, 75, 90, 95]

vehiculos:
  permitir_tandas: false          # viajes en varias tandas: por defecto se descarta

datos:
  refresco_cache_s: 300           # PostgreSQL se lee de nuevo si lo leído tiene más de 5 min; 0 = en cada consulta

cierre:                           # registro del resultado real de un viaje (transporte.servicio)
  calificacion_por_defecto: 3     # servicio.calificacion es obligatoria (1-5) y el modelo no la usa; neutro si no la envían
  incidente_por_defecto: ninguno
  utc_offset_horas: -5            # la base guarda horas locales sin zona: fechas con zona se pasan a hora Colombia

filtro:
  servicios_requeridos: 1         # capacidad de servicio mínima en la fecha

explicacion:
  max_factores: 3                 # factores a favor y en contra que se muestran
  umbral_impacto: 0.02            # impacto mínimo para mencionar un factor

puntaje:                          # orden de los candidatos: S = 100·(w_p·M + w_t·P_a + w_d·D/100 + w_c·C/100)
  # Valores iniciales acordados por el grupo el 2026-10-24 (docs/decisiones.md); deben sumar 1.
  peso_profit: 0.40               # M = profit / mejor profit entre los candidatos
  peso_a_tiempo: 0.30             # P_a = probabilidad de llegar a tiempo (simulación)
  peso_desempeno: 0.15            # D = Desempeño histórico (0-100)
  peso_confianza: 0.15            # C = Confianza (0-100)
  top_n: 4                        # candidatos que se sugieren (el resto sigue visible)

ficha:                            # ficha de proveedor (GET /proveedores/{id})
  min_servicios_segmento: 5       # servicios mínimos en una ruta o vehículo para opinar de él
  umbral_diferencia: 0.10         # diferencia frente a su promedio para llamarlo fortaleza o debilidad
  max_en_tarjeta: 2               # fortalezas y debilidades (cada una) que se copian a la tarjeta del candidato

riesgo:                           # riesgos visibles en la tarjeta del candidato, cada uno con su dato
  min_a_tiempo: 0.70              # por debajo de esta probabilidad de llegar a tiempo se avisa

textos:                           # palabras para describir la consistencia de tiempos (S_desv, sección 3.1)
  consistencia_estable: 0.70      # S_desv ≥ 0.70 → "tiempos estables"
  consistencia_variable: 0.40     # 0.40 ≤ S_desv < 0.70 → "tiempos algo variables"; menos → "muy variables"
